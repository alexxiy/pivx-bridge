# nginx in front of pivx-bridge: HTTPS, HTTP/2 and gzip (optionally brotli)
# here, the bridge on localhost only. Needs nginx 1.25.1 or newer (for
# `http2 on`).
#
# In the bridge's .env:
#   LISTEN=127.0.0.1
#   PORT=3000
#   NO_COMPRESSION=true
#   SAPLING_PARAMS_DIR=/opt/sapling-params
#
# Install: replace bridge.example.org and the listen addresses below, then
#   sudo install -m 644 contrib/nginx-pivx-bridge.conf /etc/nginx/conf.d/pivx-bridge.conf
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d bridge.example.org
#   sudo nginx -t && sudo systemctl reload nginx
# (Until the certificate exists, comment out the 443 server for the first
# certbot run.)
#
# nginx sends the Sapling parameters itself, from a directory its user can
# read (/opt/pivx-bridge is closed to it):
#   sudo install -d -m 755 /opt/sapling-params
#   sudo install -m 644 ~/.pivx-params/sapling-*.params /opt/sapling-params/
#   curl -sI https://bridge.example.org/sapling-spend.params
# (200 with content-length 47958396; a 404 means nginx can't find them.)
#
# Every open wallet keeps a /watch request here for up to 120 s, and each
# request in progress takes two connections: the wallet's and the one to the
# bridge. Debian's and Ubuntu's nginx.conf allow 768 per worker process,
# about 380 open wallets each. Raise it there, with the open files limit:
#   worker_rlimit_nofile 16384;
#   events { worker_connections 8192; }

# Optional: requests per client IP. The bridge already limits how many
# requests reach the node at once (NODE_CALLS); this keeps one client from
# taking all of them. Wallets send bursts (a sync, a governance page), and
# many Tor users share one exit IP, so keep the burst generous. Uncomment
# here and in `location /` below.
# limit_req_zone $binary_remote_addr zone=pivx_bridge:10m rate=20r/s;

upstream pivx_bridge {
    server 127.0.0.1:3000;
    # Reused connections to the bridge, instead of one per request.
    keepalive 64;
    # Shorter than the bridge keeps an idle connection (30 s), so nginx
    # never sends a request on one the bridge is just closing.
    keepalive_timeout 25s;
}

# HTTP: only the certificate challenge, everything else goes to HTTPS.
server {
    listen 203.0.113.10:80;
    listen [2001:db8::10]:80;
    server_name bridge.example.org;

    # Logs as in the HTTPS server below: a wallet set to http:// sends its
    # request URLs here first.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # One IPv4 and one IPv6 address; `listen 443 ssl;` and
    # `listen [::]:443 ssl;` for all of them.
    listen 203.0.113.10:443 ssl;
    listen [2001:db8::10]:443 ssl;
    http2 on;
    server_name bridge.example.org;

    ssl_certificate     /etc/letsencrypt/live/bridge.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 ciphers with forward secrecy and AEAD only, like every TLS 1.3
    # one (Android 5 and all current browsers have them). Don't set
    # ssl_ecdh_curve: OpenSSL's default list (3.5 and newer) brings
    # post-quantum key exchange (X25519MLKEM768) where both ends have it.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:pivx_bridge_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Request URLs carry addresses and xpubs: a log of them with client IPs
    # would tie wallets to people. nginx's error lines carry both as well (a
    # timeout, a refused request), so only critical ones are written; the
    # bridge logs its own errors.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # A wallet that stops reading (a phone that went away) is reset when it
    # times out, so the answer waiting for it doesn't keep holding memory.
    reset_timedout_connection on;

    # MyPIVXWallet sends transactions in the URL
    # (/sendrawtransaction?params=<hex>): a shield transaction is well past
    # the default 8k. The bridge itself takes up to about 400k.
    large_client_header_buffers 4 512k;
    # Transactions and /watch address lists (up to 10,000) in POST bodies;
    # the bridge takes up to 2 MB.
    client_max_body_size 2m;

    # JSON only: shield data and Sapling params are random-looking, gzip
    # saves under 2 % of them (the bridge sends them as
    # application/octet-stream).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    # Brotli for browsers (PIVXie and other apps only ask for gzip, so keep
    # gzip on). Needs the ngx_brotli module (Debian/Ubuntu:
    # libnginx-mod-http-brotli-filter); uncomment if your nginx has it. Same
    # rules as gzip: JSON only, and a middle level, since every answer is
    # compressed live.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 1024;
    # brotli_types application/json text/plain;

    # The Sapling parameters (3.6 MB and 48 MB) straight from disk, at every
    # path the bridge has them on, instead of through the bridge.
    location ~ ^/(?:mainnet/|testnet/)?(sapling-(?:output|spend)\.params)$ {
        alias /opt/sapling-params/$1;
        types { }
        default_type application/octet-stream;
        # Any add_header here drops the server's, so HSTS comes again, with
        # the CORS headers the bridge sends (MyPIVXWallet fetches the files
        # in browsers).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "*" always;
        # The files never change: wallets check their hashes.
        expires 30d;
    }

    location / {
        # limit_req zone=pivx_bridge burst=200 nodelay;
        proxy_pass http://pivx_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # No X-Forwarded-For: the bridge doesn't use client IPs, so they
        # stay here.

        # Shield data (hundreds of MB from block 0) is streamed from disk:
        # pass it straight through instead of spooling it to nginx's temp
        # files. The /watch long-poll answers as soon as something changes.
        proxy_buffering off;
        proxy_request_buffering off;
        # Unbuffered, nginx reads at most this much from the bridge at a
        # time. The default, one memory page (4k), sends the shield stream
        # in 4k TLS records and flushes gzip every 4k of a long JSON answer.
        # It's taken by every request in progress, /watch ones too.
        proxy_buffer_size 64k;
        # Unused while unbuffered, but nginx -t wants room for twice the
        # size above in all but one of them.
        proxy_buffers 4 64k;

        # /watch holds a request for up to 120 s.
        proxy_read_timeout 150s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;

        # The bridge answers CORS itself (MyPIVXWallet runs in browsers);
        # adding the headers here too would send them twice.
    }
}
