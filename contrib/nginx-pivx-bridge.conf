# nginx in front of pivx-bridge: HTTPS, HTTP/2 and gzip here, the bridge on
# localhost only. Needs nginx 1.25.1 or newer (for `http2 on`).
#
# In the bridge's .env:
#   LISTEN=127.0.0.1
#   PORT=3000
#   NO_COMPRESSION=true
#
# Install: replace bridge.example.org and the listen addresses below, then
#   sudo install -m 644 contrib/nginx-pivx-bridge.conf /etc/nginx/conf.d/pivx-bridge.conf
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d bridge.example.org
#   sudo nginx -t && sudo systemctl reload nginx
# (Until the certificate exists, comment out the 443 server for the first
# certbot run.)

# Optional: requests per client IP. The bridge already limits how many
# requests reach the node at once (NODE_CALLS); this keeps one client from
# taking all of them. Wallets send bursts (a sync, a governance page), so
# keep the burst generous. Uncomment here and in `location /` below.
# limit_req_zone $binary_remote_addr zone=pivx_bridge:10m rate=20r/s;

upstream pivx_bridge {
    server 127.0.0.1:3000;
    # Reused connections to the bridge, instead of one per request.
    keepalive 64;
}

# HTTP: only the certificate challenge, everything else goes to HTTPS.
server {
    listen 203.0.113.10:80;
    listen [2001:db8::10]:80;
    server_name bridge.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # One IPv4 and one IPv6 address; `listen 443 ssl;` and
    # `listen [::]:443 ssl;` for all of them.
    listen 203.0.113.10:443 ssl;
    listen [2001:db8::10]:443 ssl;
    http2 on;
    server_name bridge.example.org;

    ssl_certificate     /etc/letsencrypt/live/bridge.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pivx_bridge_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Request URLs carry addresses and xpubs: a log of them with client IPs
    # would tie wallets to people.
    access_log off;

    # MyPIVXWallet sends transactions in the URL
    # (/sendrawtransaction?params=<hex>): a shield transaction is well past
    # the default 8k. The bridge itself takes up to about 400k.
    large_client_header_buffers 4 512k;
    # Transactions and /watch address lists (up to 10,000) in POST bodies;
    # the bridge takes up to 2 MB.
    client_max_body_size 2m;

    # JSON only: shield data and Sapling params are random-looking, gzip
    # saves under 2 % of them (the bridge sends them as
    # application/octet-stream).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    location / {
        # limit_req zone=pivx_bridge burst=200 nodelay;
        proxy_pass http://pivx_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shield data (hundreds of MB from block 0) is streamed from disk:
        # pass it straight through instead of spooling it to nginx's temp
        # files. The /watch long-poll answers as soon as something changes.
        proxy_buffering off;
        proxy_request_buffering off;

        # /watch holds a request for up to 120 s.
        proxy_read_timeout 150s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;

        # The bridge answers CORS itself (MyPIVXWallet runs in browsers);
        # adding the headers here too would send them twice.
    }
}
