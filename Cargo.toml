[package]
name = "pivx-bridge"
version = "0.5.1"
edition = "2021"
description = "PIVX shield sync bridge — drop-in replacement for PivxNodeController, written in Rust"
license = "MIT"

[dependencies]
# HTTP server
axum = "0.8.9"
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "fs"] }

# RPC client (blocking — used in spawn_blocking)
ureq = "3.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI + env
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# ZMQ block notifications
bitcoincore-zmq = { version = "1.5", features = ["async"] }
futures = "0.3"

# Utilities
sha2 = "0.11"

# Transparent address index
redb = "4.3"
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "std"] }
hmac = "0.13"
ripemd = "0.2"
bs58 = { version = "0.5", features = ["check"] }

# Inline jq filter — pure Rust, no process fork
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
